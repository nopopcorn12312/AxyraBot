services:
  - type: web
    name: axyra-bot-backend
    env: go
    rootDirectory: backend
    buildCommand: go build -o server .
    startCommand: ./server
    plan: free
    envVars:
      - key: TWITCH_BOT_USERNAME
        value: AxyraBot
      - key: TWITCH_BOT_OAUTH
        value: "oauth:REPLACE_WITH_BOT_ACCESS_TOKEN"
      - key: TWITCH_CLIENT_ID
        value: "8ntdhbigsooa3gdey1v43hpkrf63my"
      - key: TWITCH_CLIENT_SECRET
        value: "kxywyl4dzkry13zpmmw6rlqmh7h9zz"
      - key: TWITCH_CHANNEL
        value: nopopcorn
      - key: TWITCH_EVENTSUB_ENABLED
        value: "0"
      # Optional: broadcaster user access token for EventSub (without oauth: prefix)
      # e.g. generate via Twitch OAuth for your channel account with the
      # necessary EventSub scopes and set: oauth:... in your own env, but here
      # store only the raw token value.
      # - key: TWITCH_EVENTSUB_BROADCASTER_TOKEN
      #   value: "REPLACE_WITH_BROADCASTER_EVENTSUB_TOKEN"
      # Optional: Neon/Postgres connection string, if you want DB features
      - key: DATABASE_URL
        value: "postgres://user:password@host:5432/dbname?sslmode=require"
      - key: FRONTEND_URL
        value: "https://axyrabot.com"
